<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Merchant Accounts</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172c39" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Merchant" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Your workspace for merchant accounts, payments, receipts and financial reports."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <script>
      // Paint the saved theme before Angular boots, or a light frame flashes first.
      // Kept in step with ThemeService: same key, same attribute, same meta tag.
      try {
        var theme = localStorage.getItem('merchant-accounts.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#101c25' : '#172c39');
      } catch (e) {
        // No stored preference available; the stylesheet follows the OS setting.
      }
    </script>
    <app-root></app-root>
    <noscript>Please enable JavaScript to use Merchant Accounts.</noscript>
  </body>
</html>
